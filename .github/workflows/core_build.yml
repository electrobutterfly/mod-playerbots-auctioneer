name: core-build

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'assets/**'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'assets/**'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

concurrency:
  group: "core-build-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release
          - os: ubuntu-24.04
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}-${{ matrix.cpp_compiler }}

    steps:
      - name: Checkout AzerothCore (electrobutterfly playerbots fork)
        uses: actions/checkout@v5
        with:
          repository: 'electrobutterfly/azerothcore-wotlk-playerbots'
          ref: 'Playerbot'

      - name: Checkout your module into modules/
        uses: actions/checkout@v5
        with:
          repository: 'electrobutterfly/mod-playerbots-auctioneer'
          path: 'modules/mod-playerbots-auctioneer'

      - name: Install requirements
        run: |
          # Microsoft's apt mirror (pre-configured on the runner) intermittently
          # returns 403, which aborts apt-get update with exit code 100.
          # Remove it before updating; we don't need any Microsoft packages.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y ccache git cmake make gcc g++ clang \
            libmysqlclient-dev libssl-dev libbz2-dev libreadline-dev \
            libncurses-dev mysql-server libboost-all-dev

      - name: Configure CMake
        run: |
          cmake -B build -S . \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DSCRIPTS=static \
            -DMODULES=static

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} -j $(nproc)
