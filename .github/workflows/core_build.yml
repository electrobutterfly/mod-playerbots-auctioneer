name: core-build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: "core-build-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release
          - os: ubuntu-24.04
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}-${{ matrix.cpp_compiler }}

    steps:
      - name: Checkout AzerothCore (electrobutterfly playerbots fork)
        uses: actions/checkout@v4
        with:
          repository: 'electrobutterfly/azerothcore-wotlk-playerbots'
          ref: 'Playerbot'
          fetch-depth: 1

      - name: Checkout your module into modules/
        uses: actions/checkout@v4
        with:
          repository: 'electrobutterfly/mod-playerbots-auctioneer'
          path: 'modules/mod-playerbots-auctioneer'
          fetch-depth: 1

      - name: Remove .gitmodules to prevent post-checkout hang
        run: rm -f .gitmodules

      - name: Install requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache git cmake make gcc g++ clang \
            libmysqlclient-dev libssl-dev libbz2-dev libreadline-dev \
            libncurses-dev mysql-server libboost-all-dev

      - name: Configure CMake
        run: |
          cmake -B build -S . \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DSCRIPTS=static \
            -DMODULES=static

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} -j $(nproc)
